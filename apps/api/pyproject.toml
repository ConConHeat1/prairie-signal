[project]
name = "prairie-signal-api"
version = "0.1.0"
description = "Prairie Signal weather and alert API"
requires-python = ">=3.13,<3.14"
dependencies = [
  "alembic==1.18.5",
  "asyncpg==0.30.0",
  "fastapi==0.139.2",
  "httpx==0.28.1",
  "prometheus-client==0.22.1",
  "pydantic==2.13.4",
  "pydantic-settings==2.14.2",
  "redis==8.0.1",
  "sqlalchemy[asyncio]==2.0.51",
  "structlog==25.4.0",
  "uvicorn[standard]==0.51.0",
]

[project.optional-dependencies]
dev = [
  "mypy==1.18.2",
  "pytest==9.0.3",
  "pytest-asyncio==1.4.0",
  "pytest-cov==7.0.0",
  "respx==0.22.0",
  "ruff==0.13.2",
]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/prairie_signal_api"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
asyncio_mode = "auto"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "RUF"]

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["redis.*"]
ignore_missing_imports = true
