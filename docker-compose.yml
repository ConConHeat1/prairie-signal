name: prairie-signal

services:
  db:
    image: postgis/postgis:17-3.5
    platform: linux/amd64
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-prairie_signal}
      POSTGRES_USER: ${POSTGRES_USER:-prairie_signal}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-development-only-change-me}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  cache:
    image: valkey/valkey:8.1-alpine
    command: ["valkey-server", "--save", "", "--appendonly", "no"]
    ports:
      - "${VALKEY_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://prairie_signal:development-only-change-me@db:5432/prairie_signal}
    command:
      [
        "uv",
        "run",
        "--no-sync",
        "--package",
        "prairie-signal-api",
        "alembic",
        "-c",
        "alembic.ini",
        "upgrade",
        "head"
      ]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file:
      - path: .env
        required: false
    environment:
      APP_NAME: ${APP_NAME:-Prairie Signal}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      PIPELINE_VERSION: ${PIPELINE_VERSION:-phase1-v1}
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://prairie_signal:development-only-change-me@db:5432/prairie_signal}
      CACHE_URL: ${CACHE_URL:-redis://cache:6379/0}
      NWS_USER_AGENT: ${NWS_USER_AGENT:-PrairieSignal/0.1}
      NWS_CONTACT: ${NWS_CONTACT:-}
      REGION_CONFIG_PATH: /app/configs/regions/lincoln-512km.yaml
      REGION_RADIUS_KM: ${REGION_RADIUS_KM:-256}
      ARCHIVE_DIRECTORY: /data/raw
      CENSUS_PLACES_PATH: /data/raw/location-index/places.tsv
      CENSUS_ZCTA_PATH: /data/raw/location-index/zcta.tsv
    volumes:
      - raw-data:/data/raw
      - ./configs:/app/configs:ro
    ports:
      - "8000:8000"
    depends_on:
      cache:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health')"]
      interval: 10s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  ingestion:
    build:
      context: .
      dockerfile: services/ingestion/Dockerfile
    profiles: ["live-ingestion"]
    env_file:
      - path: .env
        required: false
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      PIPELINE_VERSION: ${PIPELINE_VERSION:-phase1-v1}
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://prairie_signal:development-only-change-me@db:5432/prairie_signal}
      NWS_USER_AGENT: ${NWS_USER_AGENT:-PrairieSignal/0.1}
      NWS_CONTACT: ${NWS_CONTACT:-}
      ARCHIVE_DIRECTORY: /data/raw
      BENCHMARK_LOCATIONS: ${BENCHMARK_LOCATIONS:-lincoln-ne:40.8136:-96.7026}
    command: ["--interval-seconds", "300"]
    volumes:
      - raw-data:/data/raw
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: on-failure:5

  mrms-ingestion:
    build:
      context: .
      dockerfile: services/ingestion/Dockerfile
    profiles: ["radar"]
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      PIPELINE_VERSION: ${PIPELINE_VERSION:-mrms-reflectivity-v1}
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://prairie_signal:development-only-change-me@db:5432/prairie_signal}
      DATA_DIRECTORY: /data
      REGION_CONFIG_PATH: /app/configs/regions/lincoln-512km.yaml
      MRMS_SOURCE_CONFIG_PATH: /app/configs/sources/mrms.yaml
    command: ["--mrms-latest"]
    volumes:
      - weather-data:/data
      - ./configs:/app/configs:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: "no"

  census-loader:
    build:
      context: .
      dockerfile: services/ingestion/Dockerfile
    profiles: ["maintenance"]
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://prairie_signal:development-only-change-me@db:5432/prairie_signal}
      ARCHIVE_DIRECTORY: /data/raw
      REGION_RADIUS_KM: ${REGION_RADIUS_KM:-256}
    command: ["--load-census"]
    volumes:
      - raw-data:/data/raw
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: "no"

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      API_INTERNAL_URL: http://api:8000
      NEXT_PUBLIC_API_BASE_URL: /api/v1
      NEXT_PUBLIC_APP_NAME: ${APP_NAME:-Prairie Signal}
      NEXT_PUBLIC_SITE_URL: ${SITE_URL:-http://localhost:3000}
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000').then(r=>{if(!r.ok)process.exit(1)})"]
      interval: 10s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.13.0
    profiles: ["observability"]
    volumes:
      - ./infrastructure/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      api:
        condition: service_healthy

  grafana:
    image: grafana/grafana:13.1.0
    profiles: ["observability"]
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-development-only-change-me}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./infrastructure/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3001:3000"
    depends_on:
      - prometheus

volumes:
  postgres-data:
  raw-data:
  weather-data:
  grafana-data:
